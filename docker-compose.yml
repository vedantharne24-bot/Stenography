# Production-style stack: PostgreSQL + FastAPI (StegoNet inference) + nginx-served SPA.
#   cp .env.example .env   # then set strong secrets
#   docker compose up --build
# Open http://localhost:8080
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stegolab
      POSTGRES_USER: stegolab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stegolab -d stegolab"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://stegolab:${POSTGRES_PASSWORD}@db:5432/stegolab
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-20971520}
      TEMP_RETENTION_HOURS: ${TEMP_RETENTION_HOURS:-24}
      DEVICE: ${DEVICE:-auto}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - storage:/srv/backend/storage
      - ./backend/models:/srv/backend/models:ro
      # Held-out test carriers power the research experiments and the public demo.
      - ./data/dataset/test_carriers:/srv/data/dataset/test_carriers:ro
      - ./data/dataset/stats.json:/srv/data/dataset/stats.json:ro
    # For GPU inference build with TORCH_INDEX=https://download.pytorch.org/whl/cu128 and uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:8080"

volumes:
  pgdata:
  storage:
